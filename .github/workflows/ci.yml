name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm lint:fsd
      - run: pnpm test
      # pnpm build가 Storybook(public/storybook)까지 빌드하므로 따로 돌리지 않습니다.
      # 운영과 같은 공개 데모 빌드(어드민 "관리자로 둘러보기", 어드민 수정값의 쇼핑몰 반영)로 E2E·번들 예산을 봅니다.
      - run: pnpm build
        env:
          NEXT_PUBLIC_DEMO: "1"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - run: pnpm size
      - run: pnpm lhci
